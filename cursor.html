<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pyCodeCamp — полный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
  :root {
    --navy: #0a0a23;
    --navy-2: #1b1b32;
    --navy-3: #2a2a40;
    --text: #dfdfe2;
    --muted: #858591;
    --yellow: #f1be32;
    --green: #4caf50;
    --red: #f44336;
    --blue: #99c9ff;
    --border: #3b3b4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Lato", "Segoe UI", system-ui, sans-serif;
    background: var(--navy);
    color: var(--text);
    line-height: 1.55;
  }
  button, input { font-family: inherit; }
  a { color: var(--yellow); }

  .topbar {
    height: 52px;
    background: var(--navy-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; letter-spacing: .3px; cursor: pointer; user-select: none;
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 4px;
    background: var(--yellow); color: var(--navy);
    display: grid; place-items: center; font-weight: 900; font-size: 13px;
  }
  .top-spacer { flex: 1; }
  .py-status { font-size: 12px; color: var(--muted); }
  .py-status.ready { color: var(--green); }
  .progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 180px; }
  .progress-track { flex: 1; height: 8px; background: var(--navy-3); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--yellow); transition: width .3s; }
  .ghost-btn, .primary-btn, .danger-btn {
    border: none; cursor: pointer; border-radius: 0;
    padding: 8px 14px; font-weight: 700; font-size: 14px;
  }
  .ghost-btn { background: transparent; color: var(--text); border: 2px solid var(--text); }
  .ghost-btn:hover { background: var(--text); color: var(--navy); }
  .primary-btn { background: var(--yellow); color: #0a0a23; }
  .primary-btn:hover { background: #ffd65e; }
  .primary-btn:disabled, .ghost-btn:disabled { opacity: .45; cursor: not-allowed; }
  .danger-btn { background: transparent; color: var(--text); border: 2px solid var(--muted); }
  .icon-btn { background: none; border: 0; color: var(--text); cursor: pointer; font-size: 18px; padding: 6px; }

  /* HOME */
  .home { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
  .hero { text-align: center; margin-bottom: 48px; }
  .hero h1 { font-size: clamp(28px, 5vw, 44px); margin: 12px 0; }
  .hero p { color: var(--muted); max-width: 640px; margin: 0 auto 20px; font-size: 18px; }
  .superblock {
    background: var(--navy-2);
    border: 2px solid var(--border);
    margin-bottom: 18px;
  }
  .superblock-head {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; cursor: pointer;
  }
  .superblock-head:hover { background: var(--navy-3); }
  .sb-icon {
    width: 48px; height: 48px; flex-shrink: 0;
    display: grid; place-items: center;
    border: 3px solid var(--yellow); color: var(--yellow);
    font-weight: 800; font-size: 18px;
  }
  .sb-meta { flex: 1; }
  .sb-meta h2 { font-size: 20px; }
  .sb-meta p { color: var(--muted); font-size: 14px; }
  .sb-count { color: var(--yellow); font-weight: 700; font-size: 13px; }
  .challenge-list { display: none; border-top: 1px solid var(--border); }
  .superblock.open .challenge-list { display: block; }
  .challenge-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px 12px 28px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; color: var(--text); text-decoration: none;
  }
  .challenge-row:hover { background: var(--navy-3); }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--muted); flex-shrink: 0;
  }
  .dot.done { background: var(--green); border-color: var(--green); }
  .challenge-row .num { color: var(--muted); font-size: 13px; width: 28px; }

  /* WORKSPACE */
  .workspace { display: grid; grid-template-columns: 42% 58%; height: calc(100vh - 52px); }
  .instr {
    background: var(--navy);
    overflow: auto;
    padding: 22px 22px 90px;
    border-right: 1px solid var(--border);
  }
  .crumb { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .instr h1 { font-size: 26px; margin-bottom: 14px; }
  .instr h2 { font-size: 18px; margin: 18px 0 8px; }
  .instr p, .instr li { margin-bottom: 10px; }
  .instr ul, .instr ol { padding-left: 22px; margin-bottom: 12px; }
  .instr code, .console, .editor {
    font-family: "Consolas", "Fira Code", ui-monospace, monospace;
  }
  .instr code {
    background: var(--navy-3); color: var(--yellow);
    padding: 1px 6px; font-size: 0.92em;
  }
  .instr pre {
    background: var(--navy-2); border-left: 3px solid var(--yellow);
    padding: 12px 14px; overflow: auto; margin: 12px 0 16px; font-size: 14px;
  }
  .instr pre code { background: none; color: var(--text); padding: 0; }
  .tests { margin-top: 22px; }
  .test-item {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 8px 0; font-size: 14px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .test-item.pass { color: var(--green); }
  .test-item.fail { color: var(--red); }
  .hint-box {
    display: none; margin-top: 14px; padding: 12px;
    background: var(--navy-2); border-left: 3px solid var(--blue);
    font-size: 14px;
  }
  .editor-pane { display: flex; flex-direction: column; background: #1b1b32; min-width: 0; }
  .editor-tabs {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--navy-2); border-bottom: 1px solid var(--border);
  }
  .tab { padding: 6px 10px; font-size: 13px; color: var(--yellow); background: var(--navy-3); }
  .editor {
    flex: 1; width: 100%; min-height: 200px; resize: none;
    background: #110c1d; color: #f5f6f7; border: 0; outline: none;
    padding: 14px; font-size: 15px; line-height: 1.5; tab-size: 4;
  }
  .console-wrap { height: 180px; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
  .console-head { padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--navy-3); }
  .console {
    flex: 1; overflow: auto; padding: 10px 12px; font-size: 13px;
    white-space: pre-wrap; background: #000; color: #9cff9c;
  }
  .console.err { color: #ff8a80; }
  .bottom-bar {
    position: sticky; bottom: 0;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; background: var(--navy-2); border-top: 1px solid var(--border);
  }
  .bottom-bar .grow { flex: 1; }

  .cert {
    max-width: 720px; margin: 40px auto; padding: 40px;
    border: 8px double var(--yellow); text-align: center; background: var(--navy-2);
  }
  .cert h1 { color: var(--yellow); margin: 12px 0; }
  .cert input {
    margin: 16px 0; padding: 10px 12px; width: min(320px, 100%);
    background: var(--navy); color: var(--text); border: 1px solid var(--border);
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,10,35,.72);
    display: none; align-items: center; justify-content: center; z-index: 80;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--navy-2); padding: 28px; width: min(420px, 92vw);
    border: 1px solid var(--border); text-align: center;
  }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 12px;
    border: 3px solid var(--border); border-top-color: var(--yellow);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; height: auto; }
    .instr { max-height: none; padding-bottom: 24px; }
    .editor { min-height: 260px; }
    .progress-wrap { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" onclick="showHome()" title="На карту курса">
    <div class="brand-mark">Py</div>
    <span>pyCodeCamp</span>
  </div>
  <button class="icon-btn" id="mapBtn" onclick="showHome()" title="Карта">☰</button>
  <div class="top-spacer"></div>
  <div class="py-status" id="pyStatus">Python: загрузка…</div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
    <span id="pText" style="font-size:12px;color:var(--muted)">0/0</span>
  </div>
</header>

<div id="app"></div>
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal">
    <div class="spinner"></div>
    <p id="overlayText">Готовим интерпретатор Python…</p>
  </div>
</div>

<script>
const STORAGE_KEY = "pycodecamp-v1";

const COURSE = [
  {
    title: "Python для начинающих",
    desc: "Синтаксис, переменные, типы и операции — фундамент языка.",
    lessons: [
      {
        id: "hello",
        title: "Hello, Python",
        theory: `<p>Python — язык с простым синтаксисом. Первая программа почти всегда выводит текст.</p>
<pre><code>print("Hello, World!")</code></pre>
<p>Функция <code>print()</code> печатает значения в консоль. Строки заключают в кавычки: <code>"..."</code> или <code>'...'</code>.</p>
<p><b>Задание:</b> выведите строку <code>Hello, Python</code>.</p>`,
        starter: `print("Hello, Python")\n`,
        tests: [
          { d: "В выводе есть Hello, Python", py: "assert 'Hello, Python' in __stdout__" }
        ],
        hints: ["Вызовите print() и передайте строку в кавычках."]
      },
      {
        id: "comments",
        title: "Комментарии",
        theory: `<p>Комментарии начинаются с <code>#</code> и игнорируются интерпретатором. Их используют, чтобы объяснить код.</p>
<pre><code># Это комментарий
print(2 + 2)  # тоже комментарий</code></pre>
<p><b>Задание:</b> добавьте комментарий с текстом <code>первый комментарий</code> и выведите число <code>42</code>.</p>`,
        starter: `# напишите комментарий и вывод\n`,
        tests: [
          { d: "В коде есть комментарий «первый комментарий»", py: "assert 'первый комментарий' in __src__" },
          { d: "В выводе есть 42", py: "assert '42' in __stdout__" }
        ],
        hints: ["Строка комментария начинается с #.", "print(42)"]
      },
      {
        id: "variables",
        title: "Переменные",
        theory: `<p>Переменная — имя, связанное со значением. Тип указывать не нужно.</p>
<pre><code>name = "Ada"
year = 2026
print(name, year)</code></pre>
<p>Имя: буквы, цифры, <code>_</code>; не начинается с цифры. Регистр важен.</p>
<p><b>Задание:</b> создайте <code>language = "Python"</code> и <code>year = 1991</code>, затем выведите: <code>Python появился в 1991</code> (через f-строку или конкатенацию).</p>`,
        starter: `language = "Python"\nyear = 1991\n# выведите фразу\n`,
        tests: [
          { d: "Есть переменная language", py: "assert language == 'Python'" },
          { d: "Есть переменная year", py: "assert year == 1991" },
          { d: "Фраза в выводе", py: "assert 'Python появился в 1991' in __stdout__" }
        ],
        hints: ['print(f"{language} появился в {year}")']
      },
      {
        id: "types",
        title: "Типы данных",
        theory: `<p>Основные типы: <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>, <code>None</code>.</p>
<pre><code>print(type(3))        # int
print(type(3.14))     # float
print(type("hi"))     # str
print(type(True))     # bool</code></pre>
<p><code>type(x)</code> возвращает тип объекта.</p>
<p><b>Задание:</b> создайте <code>a=7</code>, <code>b=2.5</code>, <code>c="ok"</code>, <code>d=False</code> и выведите <code>type</code> каждого.</p>`,
        starter: `a = 7\nb = 2.5\nc = "ok"\nd = False\n`,
        tests: [
          { d: "a — int", py: "assert type(a) is int and a == 7" },
          { d: "b — float", py: "assert type(b) is float" },
          { d: "c — str", py: "assert type(c) is str" },
          { d: "d — bool", py: "assert d is False" },
          { d: "type() есть в выводе", py: "assert 'int' in __stdout__ and 'float' in __stdout__ and 'str' in __stdout__ and 'bool' in __stdout__" }
        ],
        hints: ["print(type(a)) и так далее для каждой переменной."]
      },
      {
        id: "arith",
        title: "Арифметика",
        theory: `<p>Операторы: <code>+</code> <code>-</code> <code>*</code> <code>/</code> <code>//</code> (целое деление) <code>%</code> (остаток) <code>**</code> (степень).</p>
<pre><code>print(7 // 2)  # 3
print(7 % 2)   # 1
print(2 ** 10) # 1024</code></pre>
<p><b>Задание:</b> для <code>a, b = 17, 5</code> выведите на отдельных строках сумму, целое деление и остаток.</p>`,
        starter: `a, b = 17, 5\n`,
        tests: [
          { d: "Сумма 22", py: "assert '22' in __stdout__" },
          { d: "Целое деление 3", py: "lines=__stdout__.strip().splitlines(); assert any(x.strip()=='3' for x in lines)" },
          { d: "Остаток 2", py: "lines=__stdout__.strip().splitlines(); assert any(x.strip()=='2' for x in lines)" },
          { d: "Использованы // и %", py: "assert '//' in __src__ and '%' in __src__" }
        ],
        hints: ["print(a + b)", "print(a // b)", "print(a % b)"]
      },
      {
        id: "strings-basic",
        title: "Строки: длина и срез",
        theory: `<p>Строка — последовательность символов. Индексация с нуля. Срезы: <code>s[start:end]</code>.</p>
<pre><code>s = "Python"
print(s[0])     # P
print(s[-1])    # n
print(s[0:3])   # Pyt
print(len(s))   # 6</code></pre>
<p><b>Задание:</b> для <code>word = "algorithm"</code> выведите длину, первый символ и срез <code>"algo"</code>.</p>`,
        starter: `word = "algorithm"\n`,
        tests: [
          { d: "Длина 10", py: "assert '10' in __stdout__" },
          { d: "Первый символ a", py: "assert word[0] == 'a'" },
          { d: "В выводе есть algo", py: "assert 'algo' in __stdout__" },
          { d: "Использован len", py: "assert 'len(' in __src__" }
        ],
        hints: ["print(len(word))", "print(word[0])", "print(word[:4])"]
      },
      {
        id: "fstrings",
        title: "f-строки",
        theory: `<p>f-строка подставляет выражения в фигурных скобках:</p>
<pre><code>n = 3
print(f"У меня {n} кота")</code></pre>
<p><b>Задание:</b> <code>item="книга"</code>, <code>price=499</code>. Выведите <code>Товар: книга, цена: 499 руб.</code></p>`,
        starter: `item = "книга"\nprice = 499\n`,
        tests: [
          { d: "Нужная фраза", py: "assert 'Товар: книга, цена: 499 руб.' in __stdout__" },
          { d: "Использована f-строка", py: "assert 'f\"' in __src__ or \"f'\" in __src__" }
        ],
        hints: ['print(f"Товар: {item}, цена: {price} руб.")']
      },
      {
        id: "bool-cmp",
        title: "Сравнения и bool",
        theory: `<p>Сравнения дают <code>True</code>/<code>False</code>: <code>== != &lt; &gt; &lt;= &gt;=</code>.</p>
<pre><code>print(10 > 3)      # True
print("a" == "A")  # False</code></pre>
<p>Логика: <code>and</code>, <code>or</code>, <code>not</code>.</p>
<p><b>Задание:</b> для <code>age=20</code>, <code>has_ticket=True</code> вычислите <code>can_enter = age >= 18 and has_ticket</code> и выведите результат.</p>`,
        starter: `age = 20\nhas_ticket = True\ncan_enter = None  # замените\n`,
        tests: [
          { d: "can_enter истинно", py: "assert can_enter is True" },
          { d: "Использованы and и сравнение", py: "assert 'and' in __src__ and '>=' in __src__" },
          { d: "True в выводе", py: "assert 'True' in __stdout__" }
        ],
        hints: ["can_enter = age >= 18 and has_ticket", "print(can_enter)"]
      },
      {
        id: "cast",
        title: "Преобразование типов",
        theory: `<p><code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code> меняют тип (если это возможно).</p>
<pre><code>print(int("42") + 1)   # 43
print(str(10) + "px")  # 10px
print(bool(""))        # False — пустая строка ложна</code></pre>
<p><b>Задание:</b> <code>raw = "3.5"</code>. Преобразуйте в float, умножьте на 2 и выведите результат как строку вида <code>7.0</code>.</p>`,
        starter: `raw = "3.5"\n`,
        tests: [
          { d: "Использован float()", py: "assert 'float(' in __src__" },
          { d: "В выводе 7.0", py: "assert '7.0' in __stdout__" }
        ],
        hints: ["value = float(raw) * 2", "print(value)"]
      }
    ]
  },
  {
    title: "Управляющие конструкции",
    desc: "Ветвления и циклы — как программа принимает решения и повторяет действия.",
    lessons: [
      {
        id: "if",
        title: "if / else",
        theory: `<p>Блок после <code>if</code> выполняется, если условие истинно. Отступы (4 пробела) обязательны.</p>
<pre><code>x = 10
if x > 0:
    print("плюс")
else:
    print("не плюс")</code></pre>
<p><b>Задание:</b> <code>temp = 30</code>. Если temp ≥ 25 выведите <code>жарко</code>, иначе <code>прохладно</code>.</p>`,
        starter: `temp = 30\n`,
        tests: [
          { d: "Есть if", py: "assert '\\nif ' in '\\n'+__src__ or __src__.lstrip().startswith('if ')" },
          { d: "Вывод жарко", py: "assert 'жарко' in __stdout__" }
        ],
        hints: ["if temp >= 25:", "    print('жарко')", "else:", "    print('прохладно')"]
      },
      {
        id: "elif",
        title: "elif — несколько веток",
        theory: `<pre><code>score = 75
if score >= 90:
    print("A")
elif score >= 75:
    print("B")
else:
    print("C")</code></pre>
<p><b>Задание:</b> по <code>n = 0</code> выведите <code>ноль</code>, <code>плюс</code> или <code>минус</code>.</p>`,
        starter: `n = 0\n`,
        tests: [
          { d: "Использован elif", py: "assert 'elif' in __src__" },
          { d: "Вывод ноль", py: "assert 'ноль' in __stdout__.lower()" }
        ],
        hints: ["if n > 0:", "elif n < 0:", "else:"]
      },
      {
        id: "for-range",
        title: "Цикл for и range",
        theory: `<p><code>range(n)</code> даёт числа 0 … n-1. <code>range(start, stop, step)</code> — с шагом.</p>
<pre><code>for i in range(3):
    print(i)</code></pre>
<p><b>Задание:</b> выведите числа от 1 до 5 включительно, каждое на новой строке.</p>`,
        starter: `# for i in range(...):\n`,
        tests: [
          { d: "Использован for", py: "assert 'for ' in __src__" },
          { d: "Использован range", py: "assert 'range(' in __src__" },
          { d: "Числа 1..5", py: "lines=[x.strip() for x in __stdout__.splitlines() if x.strip()]; assert lines==['1','2','3','4','5']" }
        ],
        hints: ["for i in range(1, 6):", "    print(i)"]
      },
      {
        id: "for-seq",
        title: "Обход последовательности",
        theory: `<pre><code>for ch in "hi":
    print(ch)</code></pre>
<p><b>Задание:</b> для <code>nums = [3, 1, 4]</code> выведите каждый элемент, умноженный на 10.</p>`,
        starter: `nums = [3, 1, 4]\n`,
        tests: [
          { d: "Цикл for по nums", py: "assert 'for ' in __src__ and 'in nums' in __src__.replace('  ',' ')" },
          { d: "Вывод 30 10 40", py: "lines=[x.strip() for x in __stdout__.splitlines() if x.strip()]; assert lines==['30','10','40']" }
        ],
        hints: ["for n in nums:", "    print(n * 10)"]
      },
      {
        id: "while",
        title: "Цикл while",

function flatten() {
  const out = [];
  COURSE.forEach((s, si) => s.lessons.forEach((l, li) => out.push({ ...l, section: s.title, si, li })));
  return out;
}
const LESSONS = flatten();

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { done: {}, code: {} }; }
  catch { return { done: {}, code: {} }; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
let state = loadState();
let currentId = null;
let pyodide = null;
let pyReady = false;
let hintN = 0;

function doneCount() { return LESSONS.filter(l => state.done[l.id]).length; }
function updateProgress() {
  const n = LESSONS.length, d = doneCount();
  document.getElementById("pFill").style.width = (100 * d / n) + "%";
  document.getElementById("pText").textContent = d + " / " + n;
}

function showHome() {
  currentId = null;
  const certReady = doneCount() === LESSONS.length;
  document.getElementById("app").innerHTML = `
    <div class="home">
      <div class="hero">
        <div class="brand-mark" style="margin:0 auto 12px;width:56px;height:56px;font-size:22px">Py</div>
        <h1>Изучите Python бесплатно</h1>
        <p>Интерактивный курс в духе freeCodeCamp: теория, редактор в браузере, автопроверки и сертификат. Интерпретатор — настоящий CPython через Pyodide.</p>
        <button class="primary-btn" onclick="openLesson('${firstIncomplete()}')">Продолжить курс</button>
        ${certReady ? `<button class="ghost-btn" style="margin-left:8px" onclick="showCert()">Сертификат</button>` : ""}
      </div>
      ${COURSE.map((s, si) => {
        const total = s.lessons.length;
        const done = s.lessons.filter(l => state.done[l.id]).length;
        return `<section class="superblock ${si === 0 ? "open" : ""}">
          <div class="superblock-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="sb-icon">${si + 1}</div>
            <div class="sb-meta">
              <h2>${s.title}</h2>
              <p>${s.desc}</p>
            </div>
            <div class="sb-count">${done}/${total}</div>
          </div>
          <div class="challenge-list">
            ${s.lessons.map((l, i) => `
              <div class="challenge-row" onclick="openLesson('${l.id}')">
                <span class="dot ${state.done[l.id] ? "done" : ""}"></span>
                <span class="num">${i + 1}</span>
                <span>${l.title}</span>
              </div>`).join("")}
          </div>
        </section>`;
      }).join("")}
    </div>`;
  updateProgress();
}

function firstIncomplete() {
  const l = LESSONS.find(x => !state.done[x.id]);
  return (l || LESSONS[0]).id;
}

function lessonById(id) { return LESSONS.find(l => l.id === id); }

function openLesson(id) {
  const les = lessonById(id);
  if (!les) return;
  currentId = id;
  hintN = 0;
  const idx = LESSONS.findIndex(l => l.id === id);
  const code = state.code[id] ?? les.starter;
  document.getElementById("app").innerHTML = `
    <div class="workspace">
      <section class="instr">
        <div class="crumb">${les.section} · ${idx + 1} / ${LESSONS.length}</div>
        <h1>${les.title}</h1>
        ${les.theory}
        <div class="tests" id="tests">
          ${les.tests.map((t, i) => `<div class="test-item" id="t${i}"><span>○</span><span>${t.d}</span></div>`).join("")}
        </div>
        <div class="hint-box" id="hintBox"></div>
      </section>
      <section class="editor-pane">
        <div class="editor-tabs"><div class="tab">main.py</div></div>
        <textarea class="editor" id="editor" spellcheck="false">${escapeHtml(code)}</textarea>
        <div class="console-wrap">
          <div class="console-head">Консоль</div>
          <div class="console" id="console">Нажмите «Запустить» или Ctrl+Enter. «Проверить» прогонит тесты урока.</div>
        </div>
        <div class="bottom-bar">
          <button class="primary-btn" onclick="runCode(false)">Запустить</button>
          <button class="primary-btn" onclick="runCode(true)">Проверить</button>
          <button class="danger-btn" onclick="resetCode()">Сброс</button>
          <button class="ghost-btn" onclick="showHint()">Подсказка</button>
          <span class="grow"></span>
          <button class="ghost-btn" ${idx === 0 ? "disabled" : ""} onclick="openLesson('${LESSONS[Math.max(0, idx - 1)].id}')">Назад</button>
          <button class="ghost-btn" ${idx === LESSONS.length - 1 ? "disabled" : ""} onclick="openLesson('${LESSONS[Math.min(LESSONS.length - 1, idx + 1)].id}')">Дальше</button>
        </div>
      </section>
    </div>`;
  const ed = document.getElementById("editor");
  ed.addEventListener("keydown", editorKeys);
  updateProgress();
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function editorKeys(e) {
  if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, a = t.selectionStart, b = t.selectionEnd;
    t.value = t.value.slice(0, a) + "    " + t.value.slice(b);
    t.selectionStart = t.selectionEnd = a + 4;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    runCode(true);
  }
}

function resetCode() {
  const les = lessonById(currentId);
  document.getElementById("editor").value = les.starter;
  delete state.code[currentId];
  saveState(state);
}

function showHint() {
  const les = lessonById(currentId);
  const box = document.getElementById("hintBox");
  box.style.display = "block";
  hintN = Math.min(hintN + 1, les.hints.length);
  box.innerHTML = les.hints.slice(0, hintN).map((h, i) => `<p><b>Подсказка ${i + 1}.</b> ${escapeHtml(h)}</p>`).join("");
}

function showOverlay(text, on) {
  document.getElementById("overlayText").textContent = text;
  document.getElementById("overlay").classList.toggle("show", on);
}

async function ensurePy() {
  if (pyReady) return true;
  showOverlay("Загружаем CPython в браузер (Pyodide)…", true);
  try {
    if (!pyodide) pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/" });
    pyReady = true;
    document.getElementById("pyStatus").textContent = "Python: готов";
    document.getElementById("pyStatus").classList.add("ready");
    showOverlay("", false);
    return true;
  } catch (e) {
    showOverlay("", false);
    alert("Не удалось загрузить Python. Нужен интернет к cdn.jsdelivr.net\n" + e);
    return false;
  }
}

async function runCode(check) {
  const cons = document.getElementById("console");
  const src = document.getElementById("editor").value;
  state.code[currentId] = src;
  saveState(state);
  if (!(await ensurePy())) return;
  cons.classList.remove("err");
  cons.textContent = "Выполнение…";
  const les = lessonById(currentId);
  try {
    pyodide.globals.set("__src__", src);
    await pyodide.runPythonAsync(`
import sys, io, traceback
_buf = io.StringIO()
sys.stdout = _buf
sys.stderr = _buf
_ns = {"__name__": "__main__"}
_err = None
try:
    exec(compile(__src__, "main.py", "exec"), _ns)
except Exception:
    _err = traceback.format_exc()
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
__stdout__ = _buf.getvalue()
_ns["__stdout__"] = __stdout__
_ns["__src__"] = __src__
`);
    const stdout = pyodide.runPython("str(__stdout__ or '')");
    const runtime = pyodide.runPython("_err if _err else ''");

    let text = stdout || "";
    if (runtime) {
      cons.classList.add("err");
      text += (text ? "\n" : "") + runtime;
    }

    if (check) {
      const results = [];
      for (let i = 0; i < les.tests.length; i++) {
        const t = les.tests[i];
        const el = document.getElementById("t" + i);
        try {
          if (runtime && !t.py.includes("__src__") && !t.py.includes("__stdout__")) {
            throw new Error("код не выполнился");
          }
          pyodide.globals.set("__test__", t.py);
          pyodide.runPython("exec(__test__, _ns)");
          results.push(true);
          el.className = "test-item pass";
          el.firstElementChild.textContent = "✓";
        } catch (err) {
          results.push(false);
          el.className = "test-item fail";
          el.firstElementChild.textContent = "✕";
        }
      }
      const ok = results.every(Boolean);
      if (ok) {
        state.done[currentId] = true;
        saveState(state);
        updateProgress();
        text += (text ? "\n" : "") + "Все тесты пройдены.";
        const idx = LESSONS.findIndex(l => l.id === currentId);
        if (doneCount() === LESSONS.length) {
          text += "\nКурс завершён — откройте сертификат с карты.";
        } else if (idx < LESSONS.length - 1) {
          text += " Можно переходить дальше.";
        }
      } else {
        cons.classList.add("err");
        text += (text ? "\n" : "") + "Есть непройденные тесты.";
      }
    } else if (!runtime) {
      if (!text) text = "(нет вывода)";
    }
    cons.textContent = text;
  } catch (e) {
    cons.classList.add("err");
    cons.textContent = String(e.message || e);
  }
}

function showCert() {
  if (doneCount() < LESSONS.length) {
    alert("Сначала пройдите все задания.");
    return;
  }
  document.getElementById("app").innerHTML = `
