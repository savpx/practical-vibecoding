<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация по страницам</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            padding: 32px;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f0f6fc;
        }

        p.subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 24px;
        }

        nav ul {
            list-style: none;
        }

        nav li + li {
            margin-top: 10px;
        }

        nav a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            text-decoration: none;
            color: #e6edf3;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        nav a:hover {
            background: #30363d;
            border-color: #58a6ff;
            transform: translateX(2px);
        }

        nav a .arrow {
            color: #8b949e;
            font-size: 16px;
            transition: color 0.15s ease;
        }

        nav a:hover .arrow {
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Навигация по страницам</h1>
        <p class="subtitle">Выберите страницу для перехода</p>
        <nav>
            <ul>
                <li><a href="cursor.html">cursor <span class="arrow">&rarr;</span></a></li>
                <li><a href="deepseek.html">deepseek <span class="arrow">&rarr;</span></a></li>
                <li><a href="gigachat.html">gigachat <span class="arrow">&rarr;</span></a></li>
                <li><a href="qwen.html">qwen <span class="arrow">&rarr;</span></a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
